<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Postador 2 tá bom!</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="stylesheet" href="/app.css">
</head>
<body>
<div class="app">
  <nav class="menu" aria-label="Menu principal">
    <div class="marca">2 tá bom<span>!</span><small>Postador</small></div>
    <button class="item" data-tela="fila" type="button">
      <svg aria-hidden="true" viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h10"/></svg>Fila</button>
    <button class="item" data-tela="calendario" type="button">
      <svg aria-hidden="true" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>Calendário</button>
    <button class="item" data-tela="historico" type="button">
      <svg aria-hidden="true" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>Histórico</button>
    <button class="item" data-tela="config" type="button">
      <svg aria-hidden="true" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M4.9 19.1L7 17M17 7l2.1-2.1"/></svg>Configurações</button>
    <div class="status" id="status"></div>
  </nav>
  <main id="tela" class="tela"></main>
</div>
<div class="modal" id="modal" hidden>
  <div class="caixa" role="dialog" aria-modal="true" aria-labelledby="modal-titulo">
    <h2 id="modal-titulo"></h2>
    <div id="modal-texto"></div>
    <div class="botoes"><button type="button" class="b2" id="modal-nao">Cancelar</button><button type="button" class="b1" id="modal-sim">Confirmar</button></div>
  </div>
</div>
<div class="aviso" id="aviso" role="status" aria-live="polite" hidden></div>
<script src="/app.js"></script>
</body>
</html>
